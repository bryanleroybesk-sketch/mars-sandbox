<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RD Global Connect</title>
  <meta name="description" content="RD Global Connect">
  <style>
    :root { --bg:#f7f7f5; --fg:#1d1d1f; --muted:#6b6b6b; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#121212; --fg:#f2f2f2; --muted:#9a9a9a; }
    }
    :root[data-theme="dark"] { --bg:#121212; --fg:#f2f2f2; --muted:#9a9a9a; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    main { text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; font-weight: 600; }
    p { color: var(--muted); margin: 0; font-size: 1.05rem; }
  </style>
</head>
<body>
  <main>
    <h1>RD Global Connect</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
